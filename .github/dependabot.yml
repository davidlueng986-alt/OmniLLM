# Dependabot — keep Gradle catalog / wrapper and GitHub Actions current.
# Version bumps still require human review against the toolchain lock
# (gradle/libs.versions.toml: JDK 17, AGP 9.3.x, compile/target 36, NDK r28+).
# Engine coordinates are pinned in UPSTREAM.lock — do not auto-bump them.

version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      android-agp-kotlin:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin*"
          - "androidx.*"
      ktor-coroutines:
        patterns:
          - "io.ktor*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines*"
    ignore:
      - dependency-name: "com.google.ai.edge.litertlm*"
      - dependency-name: "com.microsoft.onnxruntime*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
