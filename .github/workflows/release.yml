# OmniLLM Android - signed release assemble (fail closed)
#
# Trigger: manual workflow_dispatch or version tags (v*).
# Signing material MUST live in GitHub Actions secrets - never commit keystores
# or passwords. See tools/ci/README.md § Secrets.
#
# SEC-09 / BLD-07: a version-tag push REQUIRES all four signing secrets and
# FAILS FAST if any is absent - unsigned artifacts are never produced for tag
# releases. Signing properties are injected via ORG_GRADLE_PROJECT_* env vars
# (never argv). Signed APKs are verified with apksigner, and a lightweight
# SBOM is generated and uploaded with every release run.
#
# Produces signed APKs (and AAB when signing is configured) for:
#   - :android:app-ui          (com.omnillm)
#   - :android:companion-sandbox (com.omnillm.companion)  # ADR-007 separate UID

name: release

on:
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also run bundleRelease (AAB) for Play upload"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK: "28.2.13676358"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  release-build:
    name: Signed release build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure `python` invokes Python 3
        run: |
          if ! command -v python >/dev/null 2>&1; then
            sudo ln -sf "$(command -v python3)" /usr/local/bin/python
          fi

      - name: Install codegen dependencies
        run: pip install -r tools/codegen/requirements.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}"

      - name: Specs authority present
        run: |
          set -euo pipefail
          for f in \
            specs/canonical-types.yaml \
            specs/error-catalog.yaml \
            specs/state-machines.yaml \
            specs/access-control-catalog.yaml \
            specs/capability-catalog.yaml \
            specs/capability-availability-matrix.yaml \
            specs/engine-qualification-status.yaml \
            specs/openapi/omnillm.openapi.yaml \
            specs/aidl/omnillm-aidl.yaml \
            specs/platform-policy-register.yaml \
            specs/database/omnillm-schema.sql
          do
            test -f "$f" || { echo "MISSING authority file: $f" >&2; exit 1; }
          done
          echo "Critical specs present."

      - name: Contract drift gate
        run: ./gradlew checkContractDrift --no-daemon --stacktrace

      - name: Module dependency boundary gate
        run: |
          set -euo pipefail
          ./gradlew checkModuleDependencyRules --no-daemon --stacktrace
          python tools/ci/check_module_dependency_rules.py --repo-root .

      - name: Dependency edge gate (INV-001 / engines↛data)
        run: |
          set -euo pipefail
          ./gradlew checkDependencyEdges --no-daemon --stacktrace
          python tools/ci/check_dependency_edges.py

      - name: Unit tests (JVM + Android host; fail closed)
        run: ./gradlew test --no-daemon --stacktrace

      - name: Root check (drift + 16 KB + dep edges)
        run: ./gradlew check --no-daemon --stacktrace

      - name: Decode release keystore (fail closed on tag push)
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64:-}" ] || \
             [ -z "${SIGNING_STORE_PASSWORD:-}" ] || \
             [ -z "${SIGNING_KEY_ALIAS:-}" ] || \
             [ -z "${SIGNING_KEY_PASSWORD:-}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "::error::Release tag push requires ALL signing secrets: SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD (documented in tools/ci/README.md). Failing fast - unsigned release artifacts are never produced for tag releases."
              exit 1
            fi
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Manual workflow_dispatch without signing secrets - producing unsigned APKs for smoke testing only (never for tags)."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/omnillm-signing"
          KEYSTORE_PATH="$RUNNER_TEMP/omnillm-signing/release.jks"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "signing=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Assemble signed release (env-injected signing properties)
        if: steps.keystore.outputs.signing == 'true'
        env:
          ORG_GRADLE_PROJECT_android.injected.signing.store.file: ${{ steps.keystore.outputs.keystore_path }}
          ORG_GRADLE_PROJECT_android.injected.signing.store.password: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.password: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # SEC-09: signing properties arrive as ORG_GRADLE_PROJECT_* env vars,
          # never as -P argv (argv leaks into process listings / logs).
          ./gradlew \
            :android:app-ui:assembleRelease \
            :android:companion-sandbox:assembleRelease \
            --no-daemon --stacktrace

      - name: Assemble unsigned release (manual dispatch only, fail-closed on tags)
        if: steps.keystore.outputs.signing != 'true' && github.event_name != 'push'
        run: |
          set -euo pipefail
          ./gradlew \
            :android:app-ui:assembleRelease \
            :android:companion-sandbox:assembleRelease \
            --no-daemon --stacktrace

      - name: Verify APK signatures (apksigner, fail closed)
        if: steps.keystore.outputs.signing == 'true'
        run: |
          set -euo pipefail
          APKSIGNER="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -x "$APKSIGNER" || { echo "::error::apksigner not found at $APKSIGNER"; exit 1; }
          shopt -s nullglob
          apks=(
            android/app-ui/build/outputs/apk/release/*.apk
            android/companion-sandbox/build/outputs/apk/release/*.apk
          )
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No release APKs to verify (fail closed)."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "== apksigner verify --verbose --print-certs: $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
          echo "All signed APKs verified OK."

      - name: Bundle release AAB (signed, optional)
        if: |
          steps.keystore.outputs.signing == 'true' &&
          (github.event_name == 'push' || inputs.build_aab)
        env:
          ORG_GRADLE_PROJECT_android.injected.signing.store.file: ${{ steps.keystore.outputs.keystore_path }}
          ORG_GRADLE_PROJECT_android.injected.signing.store.password: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.password: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew \
            :android:app-ui:bundleRelease \
            :android:companion-sandbox:bundleRelease \
            --no-daemon --stacktrace

      - name: Native 16 KB gates
        run: |
          set -euo pipefail
          ./gradlew checkNative16kb --no-daemon --stacktrace
          python tools/ci/check_elf_16kb_alignment.py --min-align 16384
          shopt -s nullglob
          apks=(
            android/app-ui/build/outputs/apk/release/*.apk
            android/companion-sandbox/build/outputs/apk/release/*.apk
          )
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No release APKs for 16 KB zip-align (fail closed)."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            python tools/ci/check_apk_16kb_zipalign.py "$apk"
          done

      - name: D10 packaged-APK cleanliness gate (jansi/sqlite-jdbc junk + C-07 natives)
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app-ui/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No app-ui release APKs for verify_apk_clean (fail closed)."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            python tools/ci/verify_apk_clean.py "$apk"
          done

      - name: D9 SBOM vs APK gate (packaged set, both directions)
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app-ui/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No app-ui release APKs for verify_sbom_vs_apk (fail closed)."
            exit 1
          fi
          if [ -f SBOM-0.2.0-rc2.json ]; then
            python tools/ci/verify_sbom_vs_apk.py \
              --sbom SBOM-0.2.0-rc2.json \
              --apk "${apks[0]}"
          else
            echo "::warning::SBOM-0.2.0-rc2.json not checked in — pass it into the job (or download) so the SBOM-vs-APK gate runs."
          fi

      - name: Assert release APK artifacts exist (fail closed)
        run: |
          set -euo pipefail
          shopt -s nullglob
          required=(
            android/app-ui/build/outputs/apk/release
            android/companion-sandbox/build/outputs/apk/release
          )
          for d in "${required[@]}"; do
            apks=("$d"/*.apk)
            if [ ${#apks[@]} -eq 0 ]; then
              echo "::error::No APK under $d after assembleRelease (fail closed)."
              exit 1
            fi
            echo "OK release artifact(s): ${apks[*]}"
          done

      - name: Generate lightweight SBOM (release dependencies + notices)
        run: |
          set -euo pipefail
          mkdir -p sbom
          ./gradlew :android:app-ui:dependencies --configuration releaseRuntimeClasspath \
            > sbom/app-ui-deps.txt
          ./gradlew :android:companion-sandbox:dependencies --configuration releaseRuntimeClasspath \
            > sbom/companion-deps.txt
          cp THIRD_PARTY_NOTICES.md sbom/THIRD_PARTY_NOTICES.md
          python - <<'PY'
          import json, os, re

          # SPDX + attribution map mirrors THIRD_PARTY_NOTICES.md (BLD-03).
          LICENSES = {
              "io.ktor": "Apache-2.0",
              "com.squareup.okhttp3": "Apache-2.0",
              "app.cash.sqldelight": "Apache-2.0",
              "org.jetbrains.kotlinx": "Apache-2.0",
              "androidx": "Apache-2.0",
              "io.netty": "Apache-2.0",
          }

          def extract(path):
              found = {}
              try:
                  with open(path, encoding="utf-8") as fh:
                      for line in fh:
                          m = re.match(r"^[+|\\]\s*-+\s+([^ ]+)", line)
                          if not m:
                              continue
                          coord = m.group(1)
                          parts = coord.split(":")
                          if len(parts) < 3:
                              continue
                          g, n = parts[0], parts[1]
                          v = parts[2]
                          if "->" in v:
                              v = v.split("->")[1].strip()
                          v = re.sub(r"\(\*\)$|\(c\)$|\(n\)$", "", v).strip()
                          if v:
                              found.setdefault(f"{g}:{n}", v)
              except OSError as exc:
                  raise SystemExit(f"cannot read {path}: {exc}")
              return found

          modules = ["app-ui", "companion-sandbox"]
          deps = {}
          for mod in modules:
              for (g, n), v in extract(f"sbom/{mod}-deps.txt").items():
                  deps[f"{g}:{n}"] = {"group": g, "name": n, "version": v}

          sbom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "serialNumber": "urn:uuid:release-" + os.environ.get("GITHUB_REF_NAME", "unknown"),
              "version": 1,
              "metadata": {
                  "component": {"type": "application", "name": "com.omnillm:omnillm-android", "version": os.environ.get("GITHUB_REF_NAME", "0.0.0")},
              },
              "components": [
                  {
                      "type": "library",
                      "group": v["group"],
                      "name": v["name"],
                      "version": v["version"],
                      "licenses": [{"license": {"id": LICENSES.get(v["group"], "unknown")}}],
                  }
                  for v in sorted(deps.values(), key=lambda d: (d["group"], d["name"]))
              ],
              "notes": "Lightweight SBOM generated from `gradlew :android:app-ui|:android:companion-sandbox:dependencies --configuration releaseRuntimeClasspath` + THIRD_PARTY_NOTICES.md. llama.cpp (MIT) is vendored (engines/llama-cpp/UPSTREAM.lock); Gemma GGUF model is downloaded per-device at runtime and is NOT packaged.",
          }
          with open("sbom/omnillm-sbom.json", "w", encoding="utf-8") as out:
              json.dump(sbom, out, indent=2)
          print(f"SBOM components: {len(sbom['components'])}")
          PY

      - name: Upload release APK / AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnillm-release-${{ github.ref_name }}-${{ github.sha }}
          path: |
            android/app-ui/build/outputs/apk/release/**/*.apk
            android/app-ui/build/outputs/bundle/release/**/*.aab
            android/companion-sandbox/build/outputs/apk/release/**/*.apk
            android/companion-sandbox/build/outputs/bundle/release/**/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnillm-sbom-${{ github.ref_name }}-${{ github.sha }}
          path: sbom/
          if-no-files-found: error
          retention-days: 30

      - name: Scrub keystore from runner
        if: always() && steps.keystore.outputs.signing == 'true'
        run: |
          rm -rf "$RUNNER_TEMP/omnillm-signing" || true
