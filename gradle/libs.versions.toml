# OmniLLM version catalog — toolchain lock for Play API 36 / 16 KB native baseline.
# Product authority: ANDROID-BASELINE, ANDROID-DIST, specs/platform-policy-register.yaml
# AGP 9.3.0 (July 2026): max API 37, min Gradle 9.5.0, default NDK 28.2.x, JDK 17.
#
# PLAY-TARGET-API-2026: compileSdk AND targetSdk MUST stay at 36 for Play builds
# (as of 2026-07-31 register; recheck before every Play submission).
# Manual Play gates: gradle/RELEASE_CHECKLIST.md
# Data Safety inventory: android/app-ui/play/DATA_SAFETY_INVENTORY.md
# Companion packaging: android/companion-sandbox/PACKAGING.md

[versions]
# --- Toolchain lock (do not drift app modules to hard-coded SDK numbers) ---
agp = "9.3.2"
kotlin = "2.4.10"
gradleWrapper = "9.5.0"
jdk = "17"
ndk = "28.2.13676358"
cmake = "3.22.1"
# Locked for Google Play target Android 16 / API 36 (PLAY-TARGET-API-2026).
compileSdk = "36"
targetSdk = "36"
# Product decision (not an architecture invariant) — see README.md.
minSdk = "28"
buildTools = "36.0.0"
# App / companion version line (coherent software release; bump together unless
# companion protocol requires independent versionCode — see PACKAGING.md).
appVersionCode = "2"
appVersionName = "0.2.0"
companionVersionCode = "2"
companionVersionName = "0.2.0"

# --- Libraries (skeleton placeholders; pin further at feature implementation) ---
coroutines = "1.10.2"
serialization = "1.11.0"
androidxCore = "1.19.0"
androidxAppcompat = "1.8.0"
androidxActivity = "1.10.1"
composeBom = "2026.08.00"
lifecycle = "2.9.1"
sqldelight = "2.0.2"
ktor = "3.1.3"
okhttp = "4.12.0"
litertlm = "0.15.0"
junit = "4.13.2"
androidxJunit = "1.3.0"

[libraries]
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

sqldelight-runtime = { group = "app.cash.sqldelight", name = "runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { group = "app.cash.sqldelight", name = "coroutines-extensions", version.ref = "sqldelight" }
