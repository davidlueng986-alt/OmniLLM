  /omni/pairing/v1/exchanges:
    post:
      tags:
      - Pairing
      operationId: completeLanPairing
      summary: Complete the channel-bound LAN pairing exchange
      x-omnillm-required-scope: null
      x-omnillm-allowed-transports:
      - LAN_TLS13
      security: []
      description: Available only over the TLS 1.3 LAN listener. exchange_id makes the proof submission idempotent. An identical
        replay during the short encrypted receipt window returns the same token; changed payload, expiry, attempt exhaustion,
        SPKI/epoch mismatch or replay after receipt expiry fails closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanPairingExchangeRequest'
      responses:
        '201':
          description: Scoped LAN token issued once, with a bounded encrypted reply-loss receipt window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanPairingExchangeResult'
