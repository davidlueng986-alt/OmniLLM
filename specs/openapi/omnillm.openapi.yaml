      - BearerToken: []
      parameters:
      - $ref: '#/components/parameters/ReportIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '200':
          description: Durable cancellation command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '404': *id001
        '409': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '500': *id001
  /omni/v1/content-reports/{reportId}/discard:
    post:
      tags:
      - ContentReports
      operationId: discardContentReport
      summary: Delete an own local proposal or non-accepted queued payload
      x-omnillm-required-scope: content-reports.manage-own
      security:
      - BearerToken: []
      parameters:
      - $ref: '#/components/parameters/ReportIdPath'
