  /omni/v1/metrics/detail:
    get:
      tags:
      - Metrics
      operationId: getMetricDetail
      summary: getMetricDetail
      x-omnillm-required-scope: metrics.read-detail
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricSnapshot'
        '400': *id001
        '401': *id001
        '403': *id001
        '500': *id001
      security:
      - BearerToken: []
      x-omnillm-allowed-transports:
      - LOOPBACK
  /omni/v1/settings:
    get:
      tags:
      - Settings
      operationId: getSettings
      summary: getSettings
      x-omnillm-required-scope: settings.read
      responses:
        '200':
