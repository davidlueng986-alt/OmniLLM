components:
  securitySchemes:
    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-256-bit
  parameters:
    RequestIdPath:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetIdPath:
      name: assetId
      in: path
      required: true
      schema:
        type: string
    JobIdPath:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportIdPath:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommandIdPath:
      name: commandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageToken:
      name: page_token
      in: query
      required: false
      schema:
        type: string
        maxLength: 4096
    OptionalRequestIdHeader:
      name: X-OmniLLM-Request-Id
      in: header
      required: false
      description: Optional client-generated UUID. When omitted, the server generates one; reply-loss recovery cannot rely
        on an ID the client never received.
      schema:
        type: string
        format: uuid
    OptionalIdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional compatibility-profile idempotency key. Native asynchronous requests require this value in the
        body.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    OmniError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - IDEMPOTENCY_CONFLICT
          - STATE_CONFLICT
          - CONTEXT_LIMIT_EXCEEDED
          - TRANSPORT_TOO_LARGE
          - RATE_LIMITED
          - CAPABILITY_UNSUPPORTED
          - CAPABILITY_UNKNOWN
          - ADMISSION_REJECTED
          - MODEL_REVOKED
          - TRUST_PLACEMENT_REQUIRED
          - PAIRING_REQUIRED
          - CURSOR_GONE
          - ASSET_NOT_READY
          - ASSET_EXPIRED
          - DEADLINE_EXCEEDED
          - CANCELLED
          - WORKER_DIED
          - ABORTED_UNCERTAIN
          - STREAM_INTERRUPTED
          - CONTENT_REPORT_UNAVAILABLE
          - INTERNAL
        message:
          type: string
          maxLength: 2048
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
    ChatMessage:
      type: object
      additionalProperties: false
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          - tool
        content:
          type: string
          maxLength: 1048576
        asset_ids:
          type: array
          maxItems: 32
          items:
            type: string
    Fallback:
      type: object
      additionalProperties: false
      required:
      - policy
      properties:
        policy:
          type: string
          enum:
          - NONE
          - SAME_REVISION_ONLY
          - ALLOW_LIST
        allowed_revision_ids:
          type: array
          maxItems: 32
          items:
            type: string
            pattern: ^[0-9a-f]{64}$
    AcceptedRequest:
      type: object
      additionalProperties: false
      required:
      - request_id
      - state
      properties:
        request_id:
          type: string
          format: uuid
        state:
          type: string
        query_url:
          type: string
        events_url:
          type: string
    RequestState:
      type: object
      additionalProperties: false
      required:
      - request_id
      - state
      - resource_version
      properties:
        request_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - RECEIVED
          - CLAIMED
          - PLANNING
          - QUEUED
          - RESERVED
          - COMMITTING
          - PREPARED
          - STARTING
          - STREAMING
          - TERMINATING
          - RECONCILING
          - COMPLETED
          - FAILED
          - CANCELLED
          - ABORTED_UNCERTAIN
        resource_version:
          type: integer
          minimum: 0
        actual_model_revision_id:
          type: string
        engine_build_id:
          type: string
        backend:
          type: string
        terminal_error:
          $ref: '#/components/schemas/OmniError'
    ModelInfo:
      type: object
      additionalProperties: false
      required:
      - model_revision_id
      - display_name
      - capabilities
      properties:
        model_revision_id:
          type: string
          pattern: ^[0-9a-f]{64}$
        display_name:
          type: string
        installation_state:
          type: string
          enum:
          - DISCOVERED
          - ACQUIRING
          - QUARANTINED
          - VERIFYING
          - COMPATIBILITY_CHECK
          - READY
          - DRAINING
          - REVOKED
          - CORRUPT
          - REJECTED
          - DELETING
          - DELETED
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityEntry'
    AssetCreateRequest:
      type: object
      additionalProperties: false
      required:
      - command
      - purpose
      - max_bytes
      - ttl_seconds
      properties:
        command:
          $ref: '#/components/schemas/CommandRequest'
        purpose:
          type: string
          enum:
          - MODEL_IMPORT
          - IMAGE_INPUT
          - AUDIO_INPUT
          - DIAGNOSTIC_ATTACHMENT
          - OTHER_BOUNDED
        max_bytes:
          type: integer
          minimum: 1
          maximum: 1099511627776
        content_type_hint:
          type: string
          maxLength: 255
        expected_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 604800
    AssetInfo:
      type: object
      additionalProperties: false
      required:
      - asset_id
      - state
      - expires_at
      properties:
        asset_id:
          type: string
        state:
          type: string
          enum:
          - CREATED
          - UPLOADING
          - VERIFYING
          - READY
          - PINNED
          - CONSUMED
          - EXPIRED
          - REJECTED
          - DELETED
        bytes:
          type: integer
          minimum: 0
        sha256:
          type: string
        expires_at:
          type: string
          format: date-time
        upload_url:
          type: string
        error:
          $ref: '#/components/schemas/OmniError'
    AssetUploadRequest:
      type: object
      additionalProperties: false
      required:
      - command
      - content
      properties:
        command:
          $ref: '#/components/schemas/CommandRequest'
        content:
          type: string
          contentEncoding: binary
        expected_bytes:
          type: integer
          minimum: 0
        expected_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    JobSpec:
      type: object
      additionalProperties: false
      required:
      - command
      - job_id
      - kind
      - parameters
      properties:
        command:
          $ref: '#/components/schemas/CommandRequest'
        job_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - DOWNLOAD
          - IMPORT
          - BENCHMARK
          - DELETE
          - DIAGNOSTIC_EXPORT
          - CONTENT_REPORT
        parameters:
          oneOf:
          - $ref: '#/components/schemas/DownloadJobParameters'
          - $ref: '#/components/schemas/ImportJobParameters'
          - $ref: '#/components/schemas/BenchmarkJobParameters'
          - $ref: '#/components/schemas/DeleteJobParameters'
          - $ref: '#/components/schemas/DiagnosticExportJobParameters'
          - $ref: '#/components/schemas/ContentReportJobParameters'
      oneOf:
      - properties:
          kind:
            const: DOWNLOAD
          parameters:
            $ref: '#/components/schemas/DownloadJobParameters'
      - properties:
          kind:
            const: IMPORT
          parameters:
            $ref: '#/components/schemas/ImportJobParameters'
      - properties:
          kind:
            const: BENCHMARK
          parameters:
            $ref: '#/components/schemas/BenchmarkJobParameters'
      - properties:
          kind:
            const: DELETE
          parameters:
            $ref: '#/components/schemas/DeleteJobParameters'
      - properties:
          kind:
            const: DIAGNOSTIC_EXPORT
          parameters:
            $ref: '#/components/schemas/DiagnosticExportJobParameters'
      - properties:
          kind:
            const: CONTENT_REPORT
          parameters:
            $ref: '#/components/schemas/ContentReportJobParameters'
    JobInfo:
      type: object
      additionalProperties: false
      required:
      - job_id
      - state
      - resource_version
      properties:
        job_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - PAUSED_WAITING_INPUT
          - PAUSED_WAITING_NETWORK
          - PAUSED_WAITING_FOREGROUND
          - RECOVERING
          - SUCCEEDED
          - FAILED
          - CANCELLED
        resource_version:
          type: integer
        progress:
          type: number
          minimum: 0
          maximum: 1
        error:
          $ref: '#/components/schemas/OmniError'
    SettingsPatch:
      type: object
      additionalProperties: false
      required:
      - command
      - changes
      properties:
        command:
          $ref: '#/components/schemas/CommandRequest'
        changes:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/SettingValue'
    CommandRequest:
      type: object
      additionalProperties: false
      required:
      - command_id
      - idempotency_key
      - canonical_input_digest
      properties:
        command_id:
          type: string
          format: uuid
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        expected_version:
          type: integer
          minimum: 0
        canonical_input_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
      description: Common identity for every durable mutation. Omit expected_version only when the target resource does not
        yet exist; changed input under the same command or idempotency claim fails with IDEMPOTENCY_CONFLICT.
    CommandResult:
      type: object
      additionalProperties: false
      required:
      - command_id
      - state
      - resource_version
      properties:
        command_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - RECEIVED
          - CLAIMED
          - RUNNING
          - RECONCILING
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - UNCERTAIN
        resource_version:
          type: integer
          minimum: 0
        affected_resource_id:
          type: string
        result: {}
        error:
          $ref: '#/components/schemas/OmniError'
    ContentReportProposalRequest:
      type: object
      additionalProperties: false
      required:
      - command
      - report_id
      - category
      - created_at
      - app_build
      - model_revision_id
      - engine_build_id
      - backend
      - local_policy_version
      - output_digest
      - user_locale
      properties:
        command:
          $ref: '#/components/schemas/CommandRequest'
        report_id:
          type: string
          format: uuid
        category:
          type: string
          enum:
          - HATE_HARASSMENT
          - SEXUAL_CONTENT
          - CHILD_SAFETY
          - VIOLENCE_SELF_HARM
          - ILLEGAL_ACTIVITY
          - DECEPTION_IMPERSONATION
          - PRIVACY_PERSONAL_DATA
          - DANGEROUS_ADVICE
          - OTHER
        created_at:
          type: string
          format: date-time
        app_build:
          type: string
          minLength: 1
          maxLength: 256
        model_revision_id:
          type: string
          pattern: ^[0-9a-f]{64}$
        engine_build_id:
          type: string
          minLength: 1
          maxLength: 512
        backend:
          type: string
          minLength: 1
          maxLength: 128
        local_policy_version:
          type: string
          minLength: 1
          maxLength: 128
        output_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        user_locale:
          type: string
          minLength: 2
          maxLength: 64
        description:
          type: string
          maxLength: 4096
        prompt_excerpt:
          type: string
          maxLength: 4096
        output_excerpt:
          type: string
          maxLength: 4096
        diagnostic_summary:
          type: string
          maxLength: 4096
      description: Untrusted proposal only. The runtime binds the authenticated principal and local UI computes the canonical
        payload digest; caller input cannot act as consent evidence.
    ContentReportInfo:
      type: object
      additionalProperties: false
      required:
      - report_id
      - state
      - expires_at
      - resource_version
      properties:
        report_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - DRAFT
          - REVIEWING
          - CONSENT_GRANTED
          - QUEUED_OFFLINE
          - SUBMITTING
          - CANCELLING
          - RECONCILING
          - FAILED_RETRYABLE
          - FAILED_FINAL
          - SUBMITTED
          - DISCARDED
          - EXPIRED
        expires_at:
          type: string
          format: date-time
        receipt_id:
          type: string
        resource_version:
          type: integer
          minimum: 0
        error:
          $ref: '#/components/schemas/OmniError'
    ContentReportReceipt:
      type: object
      additionalProperties: false
      required:
      - receipt_id
      - report_id
      - accepted_at
      - status_url
      properties:
        receipt_id:
          type: string
        report_id:
          type: string
          format: uuid
        accepted_at:
          type: string
          format: date-time
        status_url:
          type: string
          format: uri
      description: Remote acceptance only; never a moderation or resolution outcome.
    Health:
      type: object
      additionalProperties: false
      required:
      - runtime_state
      - resource_version
      properties:
        runtime_state:
          type: string
        resource_version:
          type: integer
        degraded_reasons:
          type: array
          items:
            type: string
    OpenAIChatRequest:
      type: object
      additionalProperties: false
      required: &id002
      - model
      - messages
      properties:
        model: &id003
          type: string
          minLength: 1
        messages: &id004
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        max_tokens: &id005
          type: integer
          minimum: 1
        temperature: &id006
          type: number
          minimum: 0
          maximum: 2
        top_p: &id007
          type: number
          exclusiveMinimum: 0
          maximum: 1
        stop: &id008
          oneOf:
          - type: string
            maxLength: 1024
          - type: array
            maxItems: 16
            items:
              type: string
              maxLength: 1024
        response_format: &id009
          $ref: '#/components/schemas/ResponseFormat'
        tools: &id010
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/ToolDefinition'
        tool_choice: &id011
          oneOf:
          - type: string
            enum:
            - none
            - auto
            - required
          - $ref: '#/components/schemas/NamedToolChoice'
        user: &id012
          type: string
          maxLength: 256
        omnillm_fallback: &id013
          $ref: '#/components/schemas/Fallback'
        omnillm_deadline_ms: &id014
          type: integer
          minimum: 1
          maximum: 86400000
    OpenAIEmbeddingRequest:
      type: object
      additionalProperties: false
      required: &id015
      - model
      - input
      properties:
        model: &id016
          type: string
          minLength: 1
        input: &id017
          oneOf:
          - type: string
            maxLength: 1048576
          - type: array
