          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400': *id001
        '401': *id001
        '403': *id001
        '500': *id001
      security:
      - BearerToken: []
      parameters:
      - name: clientId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      x-omnillm-allowed-transports:
