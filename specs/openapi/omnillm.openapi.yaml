        '401': *id001
        '403': *id001
        '500': *id001
      security:
      - BearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSpec'
    get:
      tags:
      - Jobs
      operationId: listOwnJobs
      summary: listOwnJobs
      x-omnillm-required-scope: jobs.read-own
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '400': *id001
        '401': *id001
        '403': *id001
        '500': *id001
