openapi: 3.1.0
info:
  title: OmniLLM Local Edge API
  version: 1.1.0-design
  description: Pre-build canonical HTTP contract. OpenAI-style synchronous compatibility and native durable asynchronous requests
    are distinct profiles. Runtime support remains evidence-gated.
servers:
- url: http://127.0.0.1:{port}
  description: Loopback listener
  variables:
    port:
      default: '11434'
- url: https://{host}:{port}
  description: Optional TLS 1.3 LAN listener; operation transport allowlists still apply
  variables:
    host:
      default: omnillm.local
    port:
      default: '11435'
security:
- BearerToken: []
tags:
- name: Health
- name: Models
- name: Inference
- name: Requests
- name: Assets
- name: Jobs
- name: Metrics
- name: Settings
- name: Clients
- name: LAN
- name: Diagnostics
- name: ContentReports
- name: Tokens
- name: Pairing
paths:
  /health:
    get:
      tags:
      - Health
      operationId: getHealth
      summary: getHealth
      x-omnillm-required-scope: null
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400': &id001
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '401': *id001
        '403': *id001
        '500': *id001
      security: []
  /v1/models:
    get:
      tags:
      - Models
      operationId: listModels
      summary: listModels
      x-omnillm-required-scope: models.read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPage'
        '400': *id001
        '401': *id001
        '403': *id001
        '500': *id001
      security:
      - BearerToken: []
      parameters:
      - $ref: '#/components/parameters/PageToken'
  /v1/chat/completions:
    post:
      tags:
      - Inference
      operationId: createChatCompletion
      summary: OpenAI-style synchronous chat completion
      description: Returns HTTP 200 JSON when stream=false and HTTP 200 SSE when stream=true. This compatibility profile does
        not require client-generated IDs; use /omni/v1/requests for durable asynchronous acceptance and reply-loss reconciliation.
      x-omnillm-required-scope: inference.create
      security:
      - BearerToken: []
      parameters:
      - $ref: '#/components/parameters/OptionalRequestIdHeader'
      - $ref: '#/components/parameters/OptionalIdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIChatRequest'
      responses:
        '200':
          description: Completion JSON or SSE stream selected by request.stream.
          headers:
            X-OmniLLM-Request-Id:
              required: true
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
              examples:
                terminal:
                  value: 'data: {"id":"...","object":"chat.completion.chunk"}\n\ndata: [DONE]\n\n'
        '400':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '401':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '403':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '409':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '413':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '429':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '503':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '500':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
  /v1/embeddings:
    post:
      tags:
      - Inference
      operationId: createEmbedding
      summary: OpenAI-style synchronous embeddings
      description: Returns a completed embedding response with HTTP 200. Use /omni/v1/requests for durable asynchronous acceptance.
      x-omnillm-required-scope: inference.create
      security:
      - BearerToken: []
      parameters:
      - $ref: '#/components/parameters/OptionalRequestIdHeader'
      - $ref: '#/components/parameters/OptionalIdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIEmbeddingRequest'
      responses:
        '200':
          description: Completed embedding response
          headers:
            X-OmniLLM-Request-Id:
              required: true
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '401':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '403':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '409':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '413':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '429':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '503':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
        '500':
          description: Canonical error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniError'
  /omni/v1/requests/{requestId}:
    get:
      tags:
      - Requests
      operationId: getRequest
      summary: getRequest
      x-omnillm-required-scope: inference.read-own
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestState'
        '404': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '500': *id001
      security:
      - BearerToken: []
      parameters:
      - $ref: '#/components/parameters/RequestIdPath'
  /omni/v1/requests/{requestId}/cancel:
    post:
      tags:
      - Requests
      operationId: cancelRequest
      summary: cancelRequest
      x-omnillm-required-scope: inference.cancel
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '404': *id001
        '409': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '500': *id001
      security:
      - BearerToken: []
      parameters:
      - $ref: '#/components/parameters/RequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
  /omni/v1/commands/{commandId}:
    get:
      tags:
      - Requests
      operationId: getCommand
      summary: Query the durable result of an own command after reply loss
      x-omnillm-required-scope: commands.read-own
      responses:
        '200':
          description: Current durable command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '404': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '500': *id001
      security:
      - BearerToken: []
      parameters:
      - $ref: '#/components/parameters/CommandIdPath'
  /omni/v1/requests/{requestId}/events:
    get:
      tags:
      - Requests
      operationId: streamRequestEvents
      summary: streamRequestEvents
      x-omnillm-required-scope: inference.read-own
      responses:
        '200':
          description: SSE stream; terminal event required after stream commit
          content:
            text/event-stream:
              schema:
                type: string
        '404': *id001
        '410': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '500': *id001
      security:
      - BearerToken: []
      parameters:
      - $ref: '#/components/parameters/RequestIdPath'
      - name: after_seq
        in: query
        schema:
          type: integer
          minimum: 0
  /omni/v1/assets:
    post:
      tags:
      - Assets
      operationId: createAsset
      summary: createAsset
      x-omnillm-required-scope: assets.create
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetInfo'
        '400': *id001
        '401': *id001
        '403': *id001
        '500': *id001
      security:
      - BearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreateRequest'
  /omni/v1/assets/{assetId}/content:
    put:
      tags:
      - Assets
      operationId: uploadAsset
      summary: uploadAsset
      x-omnillm-required-scope: assets.create
      responses:
        '200':
          description: Durable upload command result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '409': *id001
        '410': *id001
        '413': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '500': *id001
      security:
      - BearerToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetUploadRequest'
      parameters:
      - $ref: '#/components/parameters/AssetIdPath'
  /omni/v1/assets/{assetId}/commit:
    post:
      tags:
      - Assets
      operationId: commitAsset
      summary: commitAsset
      x-omnillm-required-scope: assets.create
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetInfo'
        '409': *id001
        '410': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '500': *id001
      security:
      - BearerToken: []
      parameters:
      - $ref: '#/components/parameters/AssetIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
  /omni/v1/assets/{assetId}:
    get:
      tags:
      - Assets
      operationId: getAsset
      summary: getAsset
      x-omnillm-required-scope: assets.read-own
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetInfo'
        '404': *id001
        '410': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '500': *id001
      security:
      - BearerToken: []
      parameters:
      - $ref: '#/components/parameters/AssetIdPath'
    delete:
      tags:
      - Assets
      operationId: deleteAsset
      summary: deleteAsset
      x-omnillm-required-scope: assets.delete-own
      responses:
        '204':
          description: Deleted
        '409': *id001
        '404': *id001
        '400': *id001
        '401': *id001
        '403': *id001
        '500': *id001
      security:
      - BearerToken: []
      parameters:
      - $ref: '#/components/parameters/AssetIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
