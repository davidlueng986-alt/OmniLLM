  /omni/v1/requests:
    post:
      tags:
      - Requests
      operationId: createAsyncInferenceRequest
      summary: Create durable asynchronous inference request
      description: Native OmniLLM profile. The caller supplies request_id and idempotency_key before the transaction, enabling
        query/reconciliation after reply loss.
