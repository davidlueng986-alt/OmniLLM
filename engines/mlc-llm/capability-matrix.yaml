unsupportedByDefault:
  - "Any backend without pinned compiler/runtime/target (ENGINE-MLC §10)"
  - "Untrusted generated library in trusted process"
  - "Same-UID fallback when companion lacks GPU capability"
  - "Global GPU memory / cancel / driver recovery guarantees"
  - "Prefix FORK / TRUNCATE / EXACT_CROSS_SESSION without proven runtime semantics"
  - "Embedding / multimodal / tool / structured without per-cell validation"
  - "Cross-process durable KV restore after worker/driver death"
  - "Assuming old compiled artifact works with new runtime (ENGINE-MLC §9)"
  - "Silent ignore of unsupported chat/session/stream parameters"
  - "Offline compile inside ordinary inference request (must be Job)"
  - "topK sampling (mobile chat API has no top_k — fail-closed UNSUPPORTED_PARAMETER)"
  - "CPU/Vulkan execution claims on the stock opencl-only mlc4j runtime"

resourceEnvelopeDimensions:
  - cpuFileBytes           # weights / packaged files
  - cpuAnonBytes           # runtime workspace + KV + CPU scratch
  - sharedMemoryChargeBytes
  - gpuDedicatedBytes      # GPU dedicated (never fold into CPU RSS)
  - gpuSharedBytes
  - npuBytes
  - nativeThreads
  - fileDescriptors
  - temporaryDiskBytes     # kernel compile cache / temp
  # generated code/module charge rolls into cpuFileBytes + gpu* as applicable
  # kernel compile peak must appear on peak ResourceVector, not steady only
