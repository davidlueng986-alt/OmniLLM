# MLC-LLM capability matrix rows (ENGINE-MLC / ENGINE-STANDARD §5)
# Runtime exposure is projected by EngineRegistry from qualification cells.
# Design baseline ≠ SUPPORTED. Default runtime capability: UNKNOWN.
#
# Dimensions: backend × format × phase × placement × operation profile.
# Cancellation modes: COOPERATIVE | INTERRUPTIBLE | WORKER_KILL_ONLY | NOT_SUPPORTED | UNKNOWN
# Cell status: UNQUALIFIED | STATIC_REVIEWED | SPIKE_REQUIRED | QUALIFIED_WITH_ENVELOPE | SUSPENDED

schemaVersion: 1
engineId: MLC-LLM
designStatus: BASELINE
upstreamLockStatus: NOT_LOCKED
qualificationStatus: UNQUALIFIED
registryExposure: UNKNOWN
runtimeCapabilityDefault: UNKNOWN
# Stage 2E (2026-08-09): real runtime integration complete — StubRuntimeBackend
# replaced by MlcEngineRuntimeBackend binding the official generated mlc4j
# runtime (ai.mlc.mlcllm.MLCEngine) via MlcRuntimeBridge (pinned commit
# 2f78caa4; see UPSTREAM.lock). Runtime code is REAL; no device-verified
# inference ⇒ qualificationStatus stays UNQUALIFIED. Load requires a complete
# lock (pinned artifact digests) — fail closed until human pin.
integrationStatus: INTEGRATED
integrationNotes: "Real mlc4j runtime binding (MlcRuntimeBridge + MlcEngineRuntimeBackend); PENDING_QUALIFICATION — no device inference evidence; model load gated on complete UPSTREAM.lock; stock runtime device=opencl"

# Compiled model package (executable code + metadata + tokenizer + weights).
formats:
  - id: mlc-model-lib
    design: candidate
    runtimeDefault: UNKNOWN
    notes: "Generated library + weights; not ordinary data; digest + runtime ABI in identity"

backends:
  - id: cpu
    design: portable_candidate
    runtimeDefault: UNKNOWN
    notes: "Stock generated mlc4j does NOT ship a CPU target (device=opencl); no silent claims"
  - id: opencl
    design: accelerator_candidate
    runtimeDefault: UNKNOWN
    notes: "Stock mlc4j device (Device.opencl()); per device/driver/model/workload cell (ENGINE-MLC §3)"
  - id: vulkan
    design: accelerator_candidate
    runtimeDefault: UNKNOWN
    notes: "Not shipped by stock mlc4j; per device/driver/model/workload cell; no silent CPU inheritance"

operations:
  - id: PROBE
    design: supported_when_locked
    runtimeDefault: UNKNOWN
    notes: "Package/target/runtime compatibility; no blind untrusted load in privileged process"
  - id: LOAD
    design: supported_when_locked
    runtimeDefault: UNKNOWN
    notes: "Runtime + generated module; digest re-verify on trusted load"
  - id: PLAN_INFERENCE
    design: supported_when_locked
    runtimeDefault: UNKNOWN
  - id: COMMIT_INFERENCE
    design: supported_when_locked
    runtimeDefault: UNKNOWN
  - id: START
    design: supported_when_locked
    runtimeDefault: UNKNOWN
  - id: GENERATE
    design: supported_when_locked
    runtimeDefault: UNKNOWN
  - id: EMBED
    design: unknown_until_api_qualified
    runtimeDefault: UNKNOWN
    notes: "ENGINE-MLC §10 — per model/API cell"
  - id: CLOSE
    design: supported_when_locked
    runtimeDefault: UNKNOWN
  - id: UNLOAD
    design: supported_when_locked
    runtimeDefault: UNKNOWN

# Phase cancellation — design expectation vs measured mode (ENGINE-MLC §5).
# UNKNOWN phase cancellation ⇒ full LoadedModel lifecycle on killable worker only.
phaseCancellation:
  - phase: PROBE
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Bounded package/target/runtime check"
  - phase: LOAD
    expectedMode: WORKER_KILL_ONLY
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Module load + kernel compile/cache may be non-preemptible; measure peaks"
  - phase: CREATE_SESSION
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
  - phase: PLAN
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Plan has no KV mutation (ADR-002)"
  - phase: COMMIT
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Chat/session mutation bound to CommitId"
  - phase: START
    expectedMode: INTERRUPTIBLE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
  - phase: GENERATE
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Prefill/decode; cooperative cancel between stream deltas (mobile chat API has no abort); GPU command may need worker kill when cancel unbounded"
  - phase: CLOSE
    expectedMode: WORKER_KILL_ONLY
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
  - phase: UNLOAD
    expectedMode: WORKER_KILL_ONLY
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null

