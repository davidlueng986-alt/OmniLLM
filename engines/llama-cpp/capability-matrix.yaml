    evidenceStatus: NOT_EXECUTED
    cancellationMode: UNKNOWN
  - backend: cpu
    phase: CLOSE
    platform: android
    modelEnvelope: "*"
    workloadEnvelope: default
    qualificationStatus: UNQUALIFIED
    evidenceStatus: NOT_EXECUTED
    cancellationMode: UNKNOWN
  - backend: cpu
    phase: UNLOAD
    platform: android
    modelEnvelope: "*"
    workloadEnvelope: default
    qualificationStatus: UNQUALIFIED
    evidenceStatus: NOT_EXECUTED
    cancellationMode: UNKNOWN
  # Accelerator backends — explicit UNKNOWN rows (no silent inheritance from CPU)
  - backend: vulkan
    phase: GENERATE
    platform: android
    modelEnvelope: "*"
    workloadEnvelope: default
    qualificationStatus: UNQUALIFIED
    evidenceStatus: NOT_EXECUTED
    cancellationMode: UNKNOWN
  - backend: opencl
    phase: GENERATE
    platform: android
    modelEnvelope: "*"
    workloadEnvelope: default
    qualificationStatus: UNQUALIFIED
    evidenceStatus: NOT_EXECUTED
    cancellationMode: UNKNOWN

unsupportedByDefault:
  - "Android accelerator backends without per-device qualification"
  - "Mixed quantization without cell evidence"
  - "Multimodal projector / vision towers"
  - "Embedding pooling without qualified config"
  - "Prefix FORK / TRUNCATE / EXACT_CROSS_SESSION until conformance fixtures pass"
  - "KV cross-process durable restore after worker death"
  - "Silent ignore of unsupported sampling / grammar / template parameters"

resourceEnvelopeDimensions:
  - cpuFileBytes        # weights mmap / file charge
  - cpuAnonBytes        # model/context anonymous
  - sharedMemoryChargeBytes
  - gpuDedicatedBytes
  - gpuSharedBytes
  - npuBytes
  - nativeThreads
  - fileDescriptors
  - temporaryDiskBytes
  # KV / compute / sampling / grammar buffers roll into cpuAnonBytes (+ accelerator dims)
