# OmniLLM Engine Pack — mllm UPSTREAM.lock (template)
# Authority: ENGINE-MLLM §1, ENGINE-STANDARD §4
#
# Rules:
# - Architecture docs never pin "latest". Empty digests ⇒ NOT_LOCKED.
# - Registry must NOT publish QUALIFIED / SUPPORTED without a complete lock
#   (repository, tag/commit, sourceDigest, patchDigest, Go/NDK/toolchain,
#   AAR/native artifactDigest, server protocol digest, observedAt, license).
# - Builds without a complete lock are exploratory evidence only.
# - Updating any lock field ⇒ new EngineBuildId; old evidence does not auto-carry.
# - Design status BASELINE ≠ runtime SUPPORTED (ENGINE-QUALIFICATION-STATUS).
#
# Status of this file in-tree: NOT_LOCKED (template placeholders).
# Product lock state: NOT_QUALIFIED_UNTIL_UPSTREAM_LOCK
#
# Human pin checklist (fill every empty field before qualification):
#   [ ] upstream.tag and/or upstream.commit (full SHA preferred)
#   [ ] upstream.sourceDigest = SHA-256 of git archive / release tarball
#   [ ] upstream.patchDigest present (empty string OK if no OmniLLM patches)
#   [ ] upstream.observedAt = ISO-8601 UTC when digests were captured
#   [ ] license.spdx + license.licenseDigest (+ notice / dependency report)
#   [ ] toolchain.goVersion (exact; required for mllm_server.aar)
#   [ ] toolchain.ndkVersion (match product ANDROID-NATIVE lock)
#   [ ] toolchain.toolchainDigest = fingerprint(Go+NDK+host+flags)
#   [ ] build.abis non-empty (e.g. arm64-v8a, x86_64)
#   [ ] build.pageSizeEvidence pointer (16 KB packaging)
#   [ ] artifact.engineBuildId (opaque new id for this pin)
#   [ ] artifact.artifactDigest = SHA-256 of mllm_server.aar + jni
#   [ ] artifact.serverProtocolDigest = SHA-256 of frozen private-channel schema
#       (see PrivateChannelProtocol.protocolCatalogFingerprint())
#   [ ] testedProfile.backends / formats only after measured evidence packs

schemaVersion: 1
engineId: mllm
lockState: NOT_LOCKED

upstream:
  # Official repository (discovery / license source) — ENGINE-MLLM §1
  repository: "https://github.com/UbiquitousLearning/mllm"
  # Exact tag and/or full commit SHA (both preferred when available)
  tag: ""
  commit: ""
  # SHA-256 of the pinned source tree (tarball or git archive)
  sourceDigest: ""
  # SHA-256 of OmniLLM patch set applied on top of upstream (empty if none)
  patchDigest: ""
  # When the lock fields above were observed (ISO-8601 UTC). Empty until locked.
  observedAt: ""

license:
  # SPDX or short name recorded at qualification time (capture from pinned tree)
  spdx: ""
  # Path relative to pinned source for LICENSE / NOTICE capture
  licensePath: ""
  # SHA-256 of license bytes captured at lock time
  licenseDigest: ""
  # Optional notice / third-party / Go module report digests
  noticeDigest: ""
  dependencyReportDigest: ""

toolchain:
  # Must match product ANDROID-NATIVE / platform-policy locks when building for Android
  ndkVersion: "28.2.13676358"
  # Go toolchain version used to build mllm_server.aar (required for this family)
  goVersion: ""
  cmakeVersion: ""
  # Opaque digest of the full toolchain fingerprint (Go+NDK+host+flags template)
  toolchainDigest: ""
  hostOs: ""
  hostArch: ""

build:
  # Canonical build flag set for this EngineBuildId
  buildFlags: ""
  # ABIs included in this build (Android: arm64-v8a, x86_64, …)
  abis: []
  # Page-size / 16 KB packaging evidence pointer
  pageSizeEvidence: ""
  features:
    # Server lifecycle owned by Adapter; never expose external Gateway binding
    embeddedServer: true
    # Prefer private IPC / UDS; localhost TCP only with isolation + credential
    privateChannel: true
    # Accelerator backends unknown until cell evidence
    npu: false
    gpu: false

artifact:
  # EngineBuildId string published with this lock (opaque; not a native pointer)
  engineBuildId: ""
  # SHA-256 of packaged AAR / native artifact(s) (mllm_server.aar + jni)
  artifactDigest: ""
  # SHA-256 of frozen private-channel RPC schema (PrivateChannelProtocol catalog)
  serverProtocolDigest: ""
  symbolIndexDigest: ""
  # Optional model format / package identity digest once pinned
  modelFormatDigest: ""

testedProfile:
  # Labels only — evidence lives in EngineRegistry cells, not this lock alone
  platform: "android"
  backends: []
  formats: []
  # Qualification profile id once defined; empty until first evidence pack
  profileId: ""

notes:
  integrationShape: "Device-local client-server via Go mllm_server.aar; Adapter owns lifecycle, private channel, runtime credential, canonical translation"
  placementHint: "Server/native inference in independent worker; trusted same-UID crash-contained; untrusted accelerated → different-UID companion (ADR-007)"
  networkBoundary: "Embedded server must not bind LAN; no CORS wildcard; no unauthenticated management; Host alone is insufficient"
  failClosed: "Incomplete lock ⇒ Registry exposure UNKNOWN; dry-load never elevates trust; unproven ops ⇒ CAPABILITY_UNKNOWN; missing AAR never loads as success"
  protocolId: "omnillm.mllm.private-channel"
  protocolVersion: "1"
