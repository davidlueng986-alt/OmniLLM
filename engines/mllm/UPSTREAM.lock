  hostOs: "windows"
  hostArch: "x86_64"

build:
  # Canonical build flag set for this EngineBuildId (CPU path; QNN excluded)
  buildFlags: "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON -DANDROID_STL=c++_shared -std=c++17"
  # ABIs packaged by upstream release v2.0 (arm64-only prebuilt; x86_64 unsupported upstream)
  abis: ["arm64-v8a"]
  # 16 KB page-size / packaging evidence pointer — upstream CPU runtime libs
  # (libMllmRT.so, libMllmCPUBackend.so, libMllmSdkC.so, libomp.so) and
  # libgojni.so PASS tools/ci/check_elf_16kb_alignment.py (min-align 16384,
  # checked 2026-08-09). QNN NPU libs in the same zip FAIL (p_align=4096) and
  # are therefore NOT packaged — NPU remains UNKNOWN/unsupported-by-default.
  pageSizeEvidence: "tools/ci/check_elf_16kb_alignment.py on upstream v2.0 artifacts (CPU PASS, QNN FAIL-excluded)"
  features:
    # Server lifecycle owned by Adapter; never expose external Gateway binding
    embeddedServer: true
    # Loopback-only private channel (127.0.0.1:8080 fixed upstream) + credential
    privateChannel: true
    # Accelerator backends unknown until cell evidence; QNN not 16KB-ready
    npu: false
    gpu: false

