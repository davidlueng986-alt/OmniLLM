  # Upstream mllm-cli go.mod toolchain directive (the AAR is upstream-prebuilt)
  goVersion: "1.24.11"
  cmakeVersion: "3.22.1"
  # SHA-256 of the recorded toolchain fingerprint
  # (ndk+cmake+go+host+stl+std+buildFlags subset) — captured 2026-08-09
