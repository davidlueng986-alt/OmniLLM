# Known limitations / unsupported-by-default (ENGINE-MLLM §9, upstream-verified)
unsupportedByDefault:
  - "Exactly-once semantics when server protocol lacks idempotent commit/query (no server-side commit ledger)"
  - "Localhost TCP without private channel + strong runtime credential (Host/CORS alone insufficient)"
  - "Server-side authentication: upstream Go server has none — credential is adapter-enforced at the boundary"
  - "Unload / shutdown of the Go server: upstream exposes no stop/unload API; process death is the only reclaim"
  - "Embedding: upstream Go server exposes no embedding API"
  - "Multimodal / OCR: DeepSeek-OCR path exists upstream but is single-turn + image-mandatory; unsupported-by-default here"
  - "Tokenizer / KV / prefix EXACT_CROSS_SESSION / TRUNCATE / FORK without server proof"
  - "QNN NPU path: upstream v2.0 QNN libs are 4 KB page aligned only (16 KB gate FAIL) — not packaged"
  - "Go/server fixed overhead and shutdown latency assumed until measured (do not copy JNI envelopes)"
  - "External exposure of embedded mllm server (Gateway remains sole HTTP/AIDL entry)"
  - "CORS wildcard, unauthenticated management, or LAN binding on embedded server"
  - "Orphan server / port collision recovery without measured cleanup path"
  - "Silent ignore of unsupported sampling / template / multimodal parameters"
  - "Prompt content resolution from canonicalInputDigest (control plane Stage-5 work; backend fails closed until then)"

resourceEnvelopeDimensions:
  - cpuFileBytes
  - cpuAnonBytes          # includes Go/server fixed overhead + model/KV/workspace
  - sharedMemoryChargeBytes
  - gpuDedicatedBytes
  - gpuSharedBytes
  - npuBytes
  - nativeThreads
  - fileDescriptors       # port/socket/FD charge for embedded server
  - temporaryDiskBytes
  # queue/accelerator self-report does not lower envelope floor
