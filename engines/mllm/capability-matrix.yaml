# mllm capability matrix rows (ENGINE-MLLM / ENGINE-STANDARD §5)
# Runtime exposure is projected by EngineRegistry from qualification cells.
# Design baseline ≠ SUPPORTED. Default runtime capability: UNKNOWN.
#
# Integration family: device-local client-server via upstream Go mllm_server.aar
# (gomllm.Gomllm.startServer) + OpenAI-compatible HTTP/SSE on 127.0.0.1:8080.
# UPSTREAM.lock: LOCKED (mllm 2.0.0 + mllm-chat v2.0 artifacts, 2026-08-09).
# Cancellation modes: COOPERATIVE | INTERRUPTIBLE | WORKER_KILL_ONLY | NOT_SUPPORTED | UNKNOWN
# Cell status: UNQUALIFIED | STATIC_REVIEWED | SPIKE_REQUIRED | QUALIFIED_WITH_ENVELOPE | SUSPENDED
#
# Adapter must not infer capability from server marketing claims or model names.

schemaVersion: 1
engineId: mllm
designStatus: BASELINE
upstreamLockStatus: LOCKED
qualificationStatus: UNQUALIFIED
registryExposure: UNKNOWN
runtimeCapabilityDefault: UNKNOWN

# Formats/backends remain UNKNOWN runtime until pinned server/API + device evidence.
# Upstream model format is `.mllm` (converted from HF via mllm-convertor; GGUF
# data types exist but the Android Go server path is built around .mllm dirs).
formats:
  - id: mllm
    design: upstream_native_format
    runtimeDefault: UNKNOWN
    notes: "Model directory with .mllm weights + tokenizer/config; server registers the session under the directory name (e.g. qwen3)"
  - id: gguf
    design: candidate_after_lock
    runtimeDefault: UNKNOWN
    notes: "GGUF quantization types exist in upstream data types; not the Android server packaging path — no evidence"

backends:
  - id: cpu
    design: real_artifact_packaged
    runtimeDefault: UNKNOWN
    notes: "Upstream CPU runtime packaged (libMllmRT.so, libMllmCPUBackend.so, libMllmSdkC.so, libomp.so, arm64-v8a); 16 KB aligned; envelope requires Go server fixed overhead measurement"
  - id: npu
    design: accelerator_candidate
    runtimeDefault: UNKNOWN
    notes: "QNN libs NOT packaged: upstream v2.0 QNN .so are 4 KB page aligned only (16 KB gate FAIL) — no NPU claim"
  - id: gpu
    design: accelerator_candidate
    runtimeDefault: UNKNOWN
    notes: "Unqualified by default"

operations:
  - id: PROBE
    design: server_reachability_probe
    runtimeDefault: UNKNOWN
    notes: "Real: loopback TCP reachability + started-state after Gomllm.startServer"
  - id: LOAD
    design: server_start_is_model_load
    runtimeDefault: UNKNOWN
    notes: "Real: Gomllm.startServer(modelPath,...) — single-model slot per process; resolvedModelPath required (INV-010 broker)"
  - id: PLAN_INFERENCE
    design: conservative_envelope_if_no_separate_plan
    runtimeDefault: UNKNOWN
    notes: "Server has no separate plan; Adapter uses conservative envelope; plan must not mutate"
  - id: COMMIT_INFERENCE
    design: session_create_and_journal
    runtimeDefault: UNKNOWN
  - id: START
    design: map_to_server_rpc_when_locked
    runtimeDefault: UNKNOWN
  - id: GENERATE
    design: openai_chat_completions_sse
    runtimeDefault: UNKNOWN
    notes: "Real: POST /v1/chat/completions (stream=true) on 127.0.0.1:8080; SSE delta.content → canonical deltas; promptUtf8 resolution from digest is control-plane Stage-5 work"
  - id: EMBED
    design: unknown_until_api_evidence
    runtimeDefault: UNKNOWN
    notes: "Upstream Go server exposes no embedding API — UNSUPPORTED_OPERATION, not a stub"
  - id: CLOSE
    design: local_handle_release
    runtimeDefault: UNKNOWN
    notes: "Server has no close RPC; server-side KV session persists until process death (honest noop note)"
  - id: UNLOAD
    design: unsupported_by_upstream
    runtimeDefault: UNKNOWN
    notes: "Upstream has no unload API — UNSUPPORTED_OPERATION; model stays resident until process death"

# Phase cancellation — design expectation vs measured mode (ENGINE-MLLM §6).
# HTTP socket close breaks the server's r.Context() poll loop but does NOT
# prove native decode halt (measurement required before COOPERATIVE claim).
# UNKNOWN cancellation ⇒ full lifecycle on killable worker only.
phaseCancellation:
  - phase: PROBE
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Bounded reachability check; no blind model load in privileged process"
  - phase: LOAD
    expectedMode: WORKER_KILL_ONLY
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Gomllm.startServer = process start + model load; measure non-preemptible window including Go overhead"
  - phase: CREATE_SESSION
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
  - phase: PLAN
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Plan has no KV/server mutation (ADR-002)"
  - phase: COMMIT
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Server-side mutation bound to CommitId; local journal queryable on reply loss (no server commit query)"
  - phase: START
    expectedMode: INTERRUPTIBLE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
  - phase: GENERATE
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Cancellation = connection close (server breaks r.Context() poll); no cancel RPC upstream; native halt unproven"
  - phase: CLOSE
    expectedMode: WORKER_KILL_ONLY
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Shutdown latency measured; self-report does not lower envelope floor"
  - phase: UNLOAD
    expectedMode: WORKER_KILL_ONLY
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "No unload API — process death is the only reclaim"

prefixCapabilities:
  - id: EXACT_SAME_SESSION
    runtimeDefault: UNKNOWN
    notes: "Server session_id exists; exact token/KV proof required"
  - id: EXACT_CROSS_SESSION
    runtimeDefault: UNKNOWN
    notes: "Do not publish without exact token/KV proof from server"
  - id: TRUNCATE
    runtimeDefault: UNKNOWN
  - id: FORK
    runtimeDefault: UNKNOWN

placement:
  - class: PRIVILEGED_TRUSTED
    design: conditional
    runtimeDefault: UNKNOWN
    requires: "signed engine + verified catalog model + all phases qualified + private channel"
  - class: CRASH_CONTAINED_TRUSTED
    design: preferred_when_cancellation_unknown
    runtimeDefault: UNKNOWN
  - class: ISOLATED_CPU_UNTRUSTED
    design: conditional
    runtimeDefault: UNKNOWN
  - class: EXTERNAL_UID_ACCELERATED
    design: for_untrusted_acceleration
    runtimeDefault: UNKNOWN
    notes: "ADR-007 companion package/UID"

