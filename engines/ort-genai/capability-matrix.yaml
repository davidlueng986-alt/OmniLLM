unsupportedByDefault:
  - "Unpinned ORT/GenAI/provider/model config as rebuild baseline (locked 2026-08-09; still no device evidence)"
  - "Desktop EP support extrapolated to Android"
  - "Provider capability/cancel/memory without per-device cell evidence"
  - "Prefix/KV from ONNX format alone"
  - "Embedding / multimodal / tool / structured without API+model qualification"
  - "Free-form genai JSON missing required fields or unknown major"
  - "Native generator/sequence handles across AIDL"
  - "Privileged placement under UNKNOWN cancellation or unknown memory envelope"
  - "Base/feature provider module version mismatch loads"
  - "Silent ignore of unsupported sampling / template / provider parameters"

resourceEnvelopeDimensions:
  - cpuFileBytes           # weights + external data mmap / file charge
  - cpuAnonBytes           # model/generator anon + KV estimate
  - sharedMemoryChargeBytes
  - gpuDedicatedBytes
  - gpuSharedBytes
  - npuBytes               # QNN / NPU provider allocations (conservative upper bound when unknown)
  - nativeThreads
  - fileDescriptors
  - temporaryDiskBytes
  # graph optimization / provider compile-cache / workspace roll into peak envelope; never claim 0 for unknown EP memory

knownLimitations:
  - "UNQUALIFIED_UNTIL_DEVICE_EVIDENCE — design BASELINE; adapter INTEGRATED; no device-verified inference (Stage 5: instrumented tests + smoke model provisioning)"
  - "No JVM (non-Android) GenAI artifact on Maven Central — host real-inference smoke requires an upstream build-from-source JVM package or a device/emulator"
  - "No `OrtGenAI`/`Model.load(path, sessionOptions)`/separate KV-release API in v0.14.0 Java bindings — streaming via Generator + TokenizerStream; KV freed by close()"
  - "Provider variance across Android/OEM requires per-cell qualification"
  - "Prefix/KV/embed/multimodal/tools not inferred from ONNX format"
  - "Config + external-data packages need bounded parser and complete manifest"
  - "Provider crash poisons all native state; reply-loss uses ledger query only"
  - "Prompt content crosses only via promptUtf8 or staged-digest registry — digest-only SPI cannot synthesize a prompt"
