# ONNX Runtime GenAI capability matrix (ENGINE-ORTGENAI / ENGINE-STANDARD §5)
# Runtime exposure is projected by EngineRegistry from qualification cells.
# Design baseline ≠ SUPPORTED. Default runtime capability: UNKNOWN.
#
# Stage 2E (2026-08-09): upstream artifact LOCKED (onnxruntime-genai-android
# v0.14.0 AAR + base onnxruntime-android 1.25.1; see UPSTREAM.lock) and the
# adapter is INTEGRATED (real RealGenAiBackend compiled against the pinned AAR
# Java API; module compile/test/assemble green). Qualification remains
# UNQUALIFIED — no device-verified inference evidence; every cell stays
# UNQUALIFIED/NOT_EXECUTED. INTEGRATED is an integration fact, not SUPPORTED.
#
# Dimensions: backend (provider) × format × phase × placement × operation profile.
# Cancellation modes: COOPERATIVE | INTERRUPTIBLE | WORKER_KILL_ONLY | NOT_SUPPORTED | UNKNOWN
# Cell status: UNQUALIFIED | STATIC_REVIEWED | SPIKE_REQUIRED | QUALIFIED_WITH_ENVELOPE | SUSPENDED

schemaVersion: 1
engineId: ONNX-Runtime-GenAI
designStatus: BASELINE
upstreamLockStatus: LOCKED
integrationStatus: INTEGRATED
qualificationStatus: UNQUALIFIED
registryExposure: UNKNOWN
runtimeCapabilityDefault: UNKNOWN

# Integration evidence (build-log class; no device/driver/model/workload cell):
# - Backend: engines/ort-genai/src/main/kotlin/.../session/RealGenAiBackend.kt +
#   OrtGenAiRuntime.kt (direct ai.onnxruntime.genai v0.14.0 API; no OmniLLM JNI bridge)
# - Upstream pin: UPSTREAM.lock LOCKED (AAR sha256 c2e9b967…; commit b7a6ec30…)
# - Compile against real API classes (libs/onnxruntime-genai-android-0.14.0.jar =
#   classes.jar extracted from pinned AAR; sha256 32d71ee9…)
# - 16 KB ELF alignment PASS 4/4 (genai AAR) + 8/8 (base AAR); minSdk 24
# - Host JVM: native-availability detection is real (GenAI.init() throws without
#   Android .so → NOT_AVAILABLE fail-closed); no fake tokens anywhere
# - NOT device-verified: no inference on an Android device/emulator yet (Stage 5:
#   instrumented tests; smoke model provisioning documented in UPSTREAM.lock)

# Model package: ONNX model + external data + genai config + tokenizer/template + provider metadata.
# Multi-file package uses role+BlobId total order; free JSON missing fields / unknown major → fail closed.
formats:
  - id: ONNX-GENAI
    design: candidate
    runtimeDefault: UNKNOWN
    notes: "Requires pinned GenAI + config schema + tokenizer/template digests in ModelRevision"
  - id: ONNX
    design: candidate_component
    runtimeDefault: UNKNOWN
    notes: "Weights alone are not a complete package; genai config required"

backends:
  - id: cpu
    design: portable_candidate
    runtimeDefault: UNKNOWN
    notes: "Primary Android candidate; CPU EP statically linked in the pinned AAR; still per-cell device evidence"
  - id: nnapi
    design: accelerator_candidate
    runtimeDefault: UNKNOWN
    notes: "Publish only with Android package + device/driver/model/workload evidence; no desktop extrapolation; AAR has no separate NNAPI EP lib"
  - id: qnn
    design: accelerator_candidate
    runtimeDefault: UNKNOWN
    notes: "OEM/driver variance high; never inherit CPU evidence; GenAI 0.14.0 removed QNN packaging from the Android AAR"

operations:
  - id: PROBE
    design: package_and_provider_check
    runtimeDefault: UNKNOWN
    notes: "Real backend: native-load probe (GenAI.init); natives absent ⇒ NOT_AVAILABLE"
  - id: LOAD
    design: model_generator_params_provider_init_graph_opt
    runtimeDefault: UNKNOWN
    notes: "Real backend: Model(path)+Tokenizer+GeneratorParams from ONNX GenAI folder (genai_config.json required); provider init / graph optimization / compile-cache are LOAD-phase and need pre-execution envelope"
  - id: PLAN_INFERENCE
    design: session_or_sequence_state
    runtimeDefault: UNKNOWN
    notes: "If upstream lacks separate plan/commit, wrap with worker + qualified envelope + ledger"
  - id: COMMIT_INFERENCE
    design: session_or_sequence_state
    runtimeDefault: UNKNOWN
    notes: "Real backend: session = GeneratorParams holder; Generator materialized per generate"
  - id: START
    design: token_generation_drive
    runtimeDefault: UNKNOWN
  - id: GENERATE
    design: token_generation
    runtimeDefault: UNKNOWN
    notes: "Real backend: token loop (generateNextToken + TokenizerStream), stop on EOS/MAX_TOKENS/cancel; prompt from promptUtf8 or staged digest registry — never synthetic"
  - id: EMBED
    design: unknown_until_api_and_model_qualified
    runtimeDefault: UNKNOWN
    notes: "Java API has no embedding surface; remains UNKNOWN"
  - id: MULTIMODAL
    design: unknown_until_api_and_model_qualified
    runtimeDefault: UNKNOWN
  - id: STRUCTURED_TOOLS
    design: unknown_until_api_and_model_qualified
    runtimeDefault: UNKNOWN
  - id: CLOSE
    design: drain
    runtimeDefault: UNKNOWN
    notes: "Real backend: generator/params close() releases KV cache"
  - id: UNLOAD
    design: drain
    runtimeDefault: UNKNOWN

# Phase cancellation — design expectation vs measured mode (ENGINE-ORTGENAI §6).
# Provider without bounded cooperative cancel ⇒ full lifecycle on killable worker.
# Stage 2E measured note: Java bindings expose no native cancel API — cancellation
# is cooperative polling between tokens; in-flight generate is not preemptible
# ⇒ WORKER_KILL_ONLY remains the honest placement until measured on device.
phaseCancellation:
  - phase: PROBE
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Bounded package/provider check; no blind load of untrusted models in privileged process"
  - phase: LOAD
    expectedMode: WORKER_KILL_ONLY
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Includes provider init, graph optimization, compile/cache"
  - phase: CREATE_SESSION
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
  - phase: PLAN
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Plan has no KV / sequence mutation (ADR-002)"
  - phase: COMMIT
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
  - phase: START
    expectedMode: INTERRUPTIBLE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
  - phase: GENERATE
    expectedMode: COOPERATIVE
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
    notes: "Token generation; measure max non-preemptible if EP lacks cooperative cancel"
  - phase: CLOSE
    expectedMode: WORKER_KILL_ONLY
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null
  - phase: UNLOAD
    expectedMode: WORKER_KILL_ONLY
    measuredMode: UNKNOWN
    maxNonPreemptibleMs: null

prefixCapabilities:
  - id: EXACT_SAME_SESSION
    runtimeDefault: UNKNOWN
    notes: "Only when upstream exposes precise token/state ops and conformance passes"
  - id: EXACT_CROSS_SESSION
    runtimeDefault: UNKNOWN
  - id: TRUNCATE
    runtimeDefault: UNKNOWN
  - id: FORK
    runtimeDefault: UNKNOWN

placement:
  - class: PRIVILEGED_TRUSTED
    design: conditional
    runtimeDefault: UNKNOWN
    requires: "verified runtime + provider + model + all phases qualified + privileged-safe cancel"
  - class: CRASH_CONTAINED_TRUSTED
    design: conditional
    runtimeDefault: UNKNOWN
  - class: ISOLATED_CPU_UNTRUSTED
    design: preferred_for_untrusted_package
    runtimeDefault: UNKNOWN
  - class: EXTERNAL_UID_ACCELERATED
    design: for_untrusted_acceleration
    runtimeDefault: UNKNOWN
    notes: "ADR-007 companion package/UID; provider module version handshake required"

