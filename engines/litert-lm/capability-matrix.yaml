unsupportedByDefault:
  - "GGUF model files (upstream has no GGUF loading/conversion path)"
  - "Prefix truncate / fork / cross-session reuse without SDK+model cell evidence (ENGINE-LITERT §10)"
  - "Embedding without SDK version / model cell evidence"
  - "Multimodal and structured output without cell evidence"
  - "GPU/NPU backends without per-device/driver/model/workload qualification"
  - "Claiming SUPPORTED because device has NPU (ENGINE-LITERT §3)"
  - "Untrusted accelerated inference when SDK cannot isolate under different UID (ADR-007)"
  - "Treating SDK stream cancel (cancelProcess) as native execution stopped without measurement (b/450903294)"
  - "Silent ignore of unsupported sampling / template / backend parameters"
  - "Reusing Conversation / Engine objects after worker death"
  - "Cross-process durable KV restore after worker death"

resourceEnvelopeDimensions:
  - cpuFileBytes          # model package / file charge
  - cpuAnonBytes          # SDK/runtime fixed + session/KV/workspace
  - sharedMemoryChargeBytes
  - gpuDedicatedBytes
  - gpuSharedBytes
  - npuBytes
  - nativeThreads
  - fileDescriptors
  - temporaryDiskBytes    # compiled cache, temp SDK artifacts
  # ENGINE-LITERT §7: SDK fixed overhead, model bytes, compiled cache, KV/session,
  # prefill/decode workspace, CPU/GPU/NPU, threads, FD, temporary disk.
  # Vendor self-report must not lower qualified envelope.
