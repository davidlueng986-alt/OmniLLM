    cancellationMode: UNKNOWN
  - backend: cpu
    phase: PLAN
    platform: android
    modelEnvelope: "*"
    workloadEnvelope: default
    qualificationStatus: UNQUALIFIED
    evidenceStatus: NOT_EXECUTED
    cancellationMode: UNKNOWN
  - backend: cpu
    phase: COMMIT
    platform: android
    modelEnvelope: "*"
    workloadEnvelope: default
    qualificationStatus: UNQUALIFIED
    evidenceStatus: NOT_EXECUTED
    cancellationMode: UNKNOWN
  - backend: cpu
    phase: START
    platform: android
    modelEnvelope: "*"
    workloadEnvelope: default
