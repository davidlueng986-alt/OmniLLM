schemaVersion: 1
language: Android Interface Definition Language
package: ai.omnillm.api
projectionRule: generated .aidl files are projections; canonical state, scope, error and request semantics remain in the shared
  catalogs
transportConstraints:
  binderTransactionBudgetBytes: 524288
  largePayloadStrategy: AssetHandle/PFD or bounded page; never unbounded parcel payload
  streamDelivery: application ACK with streamEpoch and half-open sequence ranges
declarations:
- name: CommandResult
  kind: parcelable
  package: ai.omnillm.api
  source: "package ai.omnillm.api;\n\nimport ai.omnillm.api.OmniError;\n@JavaDerive(toString=true)\nparcelable CommandResult\
    \ {\n  String commandId;\n  String state;\n  long resourceVersion;\n  @nullable String affectedResourceId;\n  @nullable\
    \ String resultSchemaId;\n  @nullable String resultCanonicalJson;\n  @nullable OmniError error;\n}"
- name: IJobObserver
  kind: interface
  package: ai.omnillm.api
  source: "package ai.omnillm.api;\n\nimport ai.omnillm.api.OmniJobEventBatch;\nimport ai.omnillm.api.OmniError;\noneway interface\
    \ IJobObserver {\n  void onEvents(in OmniJobEventBatch batch);\n  void onRejected(in OmniError error);\n}"
- name: IOmniAdmin
  kind: interface
  package: ai.omnillm.api
  source: "package ai.omnillm.api;\n\nimport ai.omnillm.api.OmniJobSpec;\nimport ai.omnillm.api.OmniJobInfo;\nimport ai.omnillm.api.IJobObserver;\n\
    import ai.omnillm.api.CommandResult;\nimport ai.omnillm.api.OmniSettingsPatch;\nimport ai.omnillm.api.OmniSettingsSnapshot;\n\
    import ai.omnillm.api.OmniAdminSnapshot;\ninterface IOmniAdmin {\n  OmniJobInfo startJob(in OmniJobSpec spec);\n  OmniJobInfo\
    \ getJob(String jobId);\n  CommandResult cancelJob(String jobId, String commandId, String idempotencyKey);\n  String observeJobs(@nullable\
    \ String cursor, int credit, in IJobObserver observer);\n  void ackJobEvents(String subscriptionId, long streamEpoch,\
    \ long eventToExclusive);\n  void closeSubscription(String subscriptionId);\n  CommandResult applySettings(in OmniSettingsPatch\
    \ patch);\n  OmniSettingsSnapshot getSettings();\n  OmniAdminSnapshot getSnapshot();\n}"
- name: IOmniBinding
  kind: interface
  package: ai.omnillm.api
  source: "package ai.omnillm.api;\n\nimport ai.omnillm.api.OmniPairingRequest;\nimport ai.omnillm.api.OmniPairingChallenge;\n\
    import ai.omnillm.api.OmniPairingStatus;\nimport ai.omnillm.api.IOmniRuntime;\ninterface IOmniBinding {\n  OmniPairingChallenge\
    \ beginPairing(in OmniPairingRequest request);\n  OmniPairingStatus queryPairing(String challengeId);\n  @nullable IOmniRuntime\
    \ openRuntime(String registrationHandle);\n  int getProtocolMajor();\n  int getProtocolMinor();\n}"
- name: IOmniRuntime
  kind: interface
  package: ai.omnillm.api
  source: "package ai.omnillm.api;\n\nimport android.os.ParcelFileDescriptor;\nimport ai.omnillm.api.OmniChatRequest;\nimport\
    \ ai.omnillm.api.OmniEmbeddingRequest;\nimport ai.omnillm.api.IOmniStreamCallback;\nimport ai.omnillm.api.IStreamSession;\n\
    import ai.omnillm.api.OmniRequestState;\nimport ai.omnillm.api.OmniModelPage;\nimport ai.omnillm.api.CommandResult;\n\
    import ai.omnillm.api.OmniAssetCreateRequest;\nimport ai.omnillm.api.OmniAssetInfo;\nimport ai.omnillm.api.OmniAssetUploadRequest;\n\
    import ai.omnillm.api.OmniContentReportRequest;\nimport ai.omnillm.api.OmniContentReportInfo;\ninterface IOmniRuntime\
    \ {\n  IStreamSession chat(in OmniChatRequest request, in IOmniStreamCallback callback);\n  IStreamSession embed(in OmniEmbeddingRequest\
    \ request, in IOmniStreamCallback callback);\n  OmniRequestState queryRequest(String requestId);\n  CommandResult cancelRequest(String\
    \ requestId, String commandId, String idempotencyKey);\n  OmniModelPage listModels(@nullable String pageToken, int pageSize);\n\
    \  OmniAssetInfo createAsset(in OmniAssetCreateRequest request);\n  CommandResult uploadAssetContent(in OmniAssetUploadRequest\
    \ request, in ParcelFileDescriptor content);\n  OmniAssetInfo commitAsset(String assetId, String commandId, String idempotencyKey);\n\
    \  OmniAssetInfo getAsset(String assetId);\n  CommandResult deleteAsset(String assetId, String commandId, String idempotencyKey);\n\
    \  OmniContentReportInfo createContentReport(in OmniContentReportRequest request);\n  OmniContentReportInfo getContentReport(String\
    \ reportId);\n  int getProtocolMajor();\n  int getProtocolMinor();\n}"
