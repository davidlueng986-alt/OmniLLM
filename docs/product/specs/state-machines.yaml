    from: CANCELLING
    event: OUTCOME_UNKNOWN
    to: RECONCILING
    guard: 'true'
    actions:
    - queryOutcome
  - id: OPR-016
    from: RECONCILING
    event: FOUND_COMPLETED
    to: COMPLETED
    guard: resultKnown
    actions:
    - publishTerminal
  - id: OPR-017
    from: RECONCILING
    event: FOUND_FAILED
