- id: ENGINE_MODULE
  initial: ABSENT
  terminal: []
  states:
  - ABSENT
  - INSTALLING
  - INSTALLED
  - VALIDATING
  - AVAILABLE
  - DRAINING
  - RESTART_REQUIRED
  - ROLLING_BACK
  - FAILED
  guards:
    artifactLockValid: module digest, engineBuildId, protocol version and signer match
    noLiveModels: all loaded models/sessions using module are drained
    rollbackArtifactValid: previous signed/locked artifact is available
  actions:
    installArtifact: materialize and verify module artifact
    validateHandshake: probe every target process and compare protocol/artifact digest
    blockNewLoads: remove module from routing candidates
    restartProcesses: restart affected process set and clear stale loader cache
    rollbackArtifact: atomically restore previous module and record reason
  invariants:
  - AVAILABLE requires artifact/protocol handshake in every target process
  - module update never unloads code under a live model
  - failed validation does not publish capabilities
  - EngineBuildId changes when executable artifact or patch changes
  transitions:
  - id: MODU-001
    from: ABSENT
    event: INSTALL
    to: INSTALLING
    guard: artifactLockValid
    actions:
    - installArtifact
  - id: MODU-002
    from: INSTALLING
    event: INSTALL_SUCCEEDED
    to: INSTALLED
    guard: artifactLockValid
    actions: []
  - id: MODU-003
    from: INSTALLING
    event: INSTALL_FAILED
    to: FAILED
    guard: 'true'
    actions: []
  - id: MODU-004
    from: INSTALLED
    event: BEGIN_VALIDATION
    to: VALIDATING
    guard: artifactLockValid
    actions:
    - validateHandshake
  - id: MODU-005
    from: VALIDATING
    event: VALIDATED
    to: AVAILABLE
    guard: artifactLockValid
    actions: []
  - id: MODU-006
    from: VALIDATING
    event: VALIDATION_FAILED
    to: FAILED
    guard: 'true'
    actions: []
  - id: MODU-007
    from: AVAILABLE
    event: UPDATE_OR_REMOVE
    to: DRAINING
    guard: 'true'
    actions:
    - blockNewLoads
  - id: MODU-008
    from: DRAINING
    event: DRAIN_COMPLETE_RESTART
    to: RESTART_REQUIRED
    guard: noLiveModels
    actions: []
  - id: MODU-009
    from: RESTART_REQUIRED
    event: PROCESSES_RESTARTED
    to: INSTALLED
    guard: 'true'
    actions:
    - restartProcesses
  - id: MODU-010
    from: FAILED
    event: ROLLBACK
    to: ROLLING_BACK
    guard: rollbackArtifactValid
    actions:
    - rollbackArtifact
  - id: MODU-011
    from: ROLLING_BACK
    event: ROLLBACK_INSTALLED
    to: INSTALLED
    guard: rollbackArtifactValid
    actions: []
  - id: MODU-012
    from: FAILED
    event: REMOVE_FAILED_ARTIFACT
    to: ABSENT
    guard: 'true'
    actions: []
- id: ALLOCATION
  initial: ACTIVE
  terminal:
  - RELEASED
  states:
  - ACTIVE
  - DRAINING
  - RELEASING
  - RELEASED
  guards:
    ownerFenced: owner no longer accepts new work
    nativeBarrierObserved: native/process/device resources are proven released or owning process is dead and fenced
  actions:
    blockNewUse: fence allocation owner
    beginRelease: initiate close/unmap/free/worker termination
    creditCapacity: credit capacity only after release barrier and checked conservation audit
  invariants:
  - resident resources remain charged through DRAINING and RELEASING
  - release is idempotent
  - capacity is never credited from planned eviction
  transitions:
  - id: ALL-001
    from: ACTIVE
    event: DRAIN_REQUESTED
    to: DRAINING
    guard: 'true'
    actions:
    - blockNewUse
  - id: ALL-002
    from: DRAINING
    event: OWNER_QUIESCENT
    to: RELEASING
    guard: ownerFenced
    actions:
    - beginRelease
  - id: ALL-003
    from: RELEASING
    event: RELEASE_BARRIER
    to: RELEASED
    guard: nativeBarrierObserved
    actions:
    - creditCapacity
- id: REVISION_LEASE
  initial: ACTIVE
  terminal:
  - RELEASED
  states:
  - ACTIVE
  - DRAINING
  - RELEASED
  guards:
    noReferences: request/model/session/job references covered by lease are zero
  actions:
    blockDelete: keep installation/blob deletion fenced
    beginDrain: stop new reference acquisition for this lease
    releasePin: atomically decrement revision/installation references
  invariants:
  - alias changes do not alter pinned revision
  - delete cannot pass while ACTIVE or DRAINING
  - expiry requests drain; it does not erase a live reference
  transitions:
  - id: RLS-001
    from: ACTIVE
    event: RELEASE_OR_EXPIRY
    to: DRAINING
    guard: 'true'
    actions:
    - beginDrain
  - id: RLS-002
    from: DRAINING
    event: REFERENCES_ZERO
    to: RELEASED
    guard: noReferences
    actions:
    - releasePin
- id: COMMAND
  initial: RECEIVED
  terminal:
  - SUCCEEDED
  - FAILED
  - CANCELLED
  - UNCERTAIN
  states:
  - RECEIVED
  - CLAIMED
  - RUNNING
  - RECONCILING
  - SUCCEEDED
  - FAILED
  - CANCELLED
  - UNCERTAIN
  guards:
    claimMatches: owner+method+idempotency key has same canonical request hash
    resultKnown: command ledger has one durable result
  actions:
    claimCommand: atomically claim or return existing command
    executeMutation: perform state-checked mutation in the same transaction/intent protocol
    queryResult: query command ledger and affected resource version
    publishResult: persist result/error/resourceVersion before reply
  invariants:
  - same key with different payload conflicts
  - reply loss never repeats a non-idempotent mutation
  - void mutation is forbidden
  transitions:
  - id: CMD-001
    from: RECEIVED
    event: CLAIM
    to: CLAIMED
    guard: claimMatches
    actions:
    - claimCommand
  - id: CMD-002
    from: RECEIVED
    event: VALIDATION_FAILED
    to: FAILED
    guard: 'true'
    actions:
    - publishResult
  - id: CMD-003
    from: CLAIMED
    event: EXECUTE
    to: RUNNING
    guard: 'true'
    actions:
    - executeMutation
  - id: CMD-004
    from: CLAIMED
    event: CANCEL
    to: CANCELLED
    guard: 'true'
    actions:
    - publishResult
  - id: CMD-005
    from: RUNNING
    event: SUCCEEDED
    to: SUCCEEDED
    guard: resultKnown
    actions:
    - publishResult
  - id: CMD-006
    from: RUNNING
    event: FAILED
    to: FAILED
    guard: resultKnown
    actions:
    - publishResult
  - id: CMD-007
    from: RUNNING
    event: REPLY_OR_PROCESS_LOST
    to: RECONCILING
    guard: 'true'
    actions:
    - queryResult
  - id: CMD-008
    from: RECONCILING
    event: FOUND_SUCCESS
    to: SUCCEEDED
    guard: resultKnown
    actions:
    - publishResult
  - id: CMD-009
    from: RECONCILING
    event: FOUND_FAILURE
    to: FAILED
    guard: resultKnown
    actions:
    - publishResult
  - id: CMD-010
    from: RECONCILING
    event: UNPROVABLE
    to: UNCERTAIN
    guard: 'true'
    actions:
    - publishResult
- id: PAIRING_CHALLENGE
  initial: PENDING
  terminal:
  - REJECTED
  - EXPIRED
  - CONSUMED
  states:
  - PENDING
  - APPROVED
  - REJECTED
  - EXPIRED
  - CONSUMED
  guards:
    identityBound: challenge is bound to observed principal, requested scopes and channel/TLS binding
    withinAttemptAndTimeLimit: TTL and attempt budget remain
    approvalLocal: approval occurs in trusted local UI
  actions:
    recordAttempt: durably decrement attempt budget
    recordApproval: persist approved scope/channel binding without issuing long-term secret yet
    consumeChallenge: atomically create registration/token and make challenge non-replayable
  invariants:
  - challenge is high entropy, one-time and bounded
  - approval does not bypass scope policy
  - consumption is atomic with registration/token issuance
  transitions:
  - id: PAIR-001
    from: PENDING
    event: APPROVE
    to: APPROVED
    guard: identityBound && withinAttemptAndTimeLimit && approvalLocal
    actions:
    - recordApproval
  - id: PAIR-002
    from: PENDING
    event: REJECT
    to: REJECTED
    guard: identityBound
    actions:
    - recordAttempt
  - id: PAIR-003
    from: PENDING
    event: EXPIRE
    to: EXPIRED
    guard: 'true'
    actions: []
  - id: PAIR-004
    from: APPROVED
    event: CONSUME
    to: CONSUMED
    guard: identityBound && withinAttemptAndTimeLimit
    actions:
    - consumeChallenge
  - id: PAIR-005
    from: APPROVED
    event: EXPIRE
    to: EXPIRED
    guard: 'true'
    actions: []
- id: LAN_SERVICE
  initial: DISABLED
  terminal: []
  states:
  - DISABLED
  - STARTING
  - ADVERTISING
  - ACTIVE
  - ROTATING
  - DRAINING
  - ERROR
  guards:
  - configurationValid
  - tlsIdentityReady
  - pairingEndpointReady
  - epochAdvanced
  - allStreamsAndClientsDrained
  - retryAllowed
  actions:
  - persistState
  - bindApprovedInterfaces
  - publishPairingLocator
  - stopAccepting
  - bumpConnectionEpoch
  - closeStreams
  - revokeOrMigrateRegistrations
  - releaseNetworkResources
  - recordFailure
  invariants:
  - LAN never accepts inference before TLS identity and pairing endpoint are ready
  - every network identity or binding change advances the connection epoch before accepting new work
  - DISABLED has no bound LAN listener
  - DRAINING accepts no new client or request
  transitions:
  - id: LAN-001
    from: DISABLED
    event: ENABLE
    to: STARTING
    guard: configurationValid
    actions:
    - persistState
  - id: LAN-002
    from: STARTING
    event: LISTENER_READY
    to: ADVERTISING
    guard: tlsIdentityReady && pairingEndpointReady
    actions:
    - bindApprovedInterfaces
    - publishPairingLocator
    - persistState
  - id: LAN-003
    from: ADVERTISING
    event: SERVICE_ACTIVE
    to: ACTIVE
    guard: 'true'
    actions:
    - persistState
  - id: LAN-004
    from: ACTIVE
    event: IDENTITY_OR_BINDING_CHANGED
    to: ROTATING
    guard: 'true'
    actions:
    - stopAccepting
    - bumpConnectionEpoch
    - persistState
  - id: LAN-005
    from: ROTATING
    event: NEW_IDENTITY_READY
    to: ADVERTISING
    guard: epochAdvanced && tlsIdentityReady
    actions:
    - revokeOrMigrateRegistrations
    - publishPairingLocator
    - persistState
  - id: LAN-006
    from:
    - STARTING
    - ADVERTISING
    - ACTIVE
    - ROTATING
    - ERROR
    event: DISABLE
    to: DRAINING
    guard: 'true'
    actions:
    - stopAccepting
    - bumpConnectionEpoch
    - closeStreams
    - persistState
  - id: LAN-007
    from: DRAINING
    event: DRAIN_COMPLETE
    to: DISABLED
    guard: allStreamsAndClientsDrained
    actions:
    - releaseNetworkResources
    - persistState
  - id: LAN-008
    from:
    - STARTING
    - ADVERTISING
    - ACTIVE
    - ROTATING
    event: FAIL
    to: ERROR
    guard: 'true'
    actions:
    - stopAccepting
    - recordFailure
    - persistState
  - id: LAN-009
    from: ERROR
    event: RETRY
    to: STARTING
    guard: retryAllowed
    actions:
    - persistState
- id: CONTENT_REPORT
  initial: DRAFT
  terminal:
  - SUBMITTED
  - CANCELLED
  - EXPIRED
  states:
  - DRAFT
  - CONSENTED
  - QUEUED
  - SUBMITTING
  - FAILED_RETRYABLE
  - SUBMITTED
  - CANCELLED
  - EXPIRED
  guards:
  - userExplicitlyConfirmed
  - payloadMinimized
  - consentStillValid
  - networkAndEndpointAvailable
  - withinTtl
  - retryAllowed
  actions:
  - showPayloadPreview
  - persistEncryptedDraft
  - enqueueReport
  - submitReport
  - recordReceipt
  - recordFailure
  - deleteSensitivePayload
  - appendAudit
  invariants:
  - no prompt or output leaves the device before explicit confirmation of the exact minimized payload
  - report payload is owner-bound, encrypted at rest and TTL-bounded
  - cancellation or expiry removes sensitive payload
  - submission receipt never implies moderation outcome
  transitions:
  - id: RPT-001
    from: DRAFT
    event: CONFIRM
    to: CONSENTED
    guard: userExplicitlyConfirmed && payloadMinimized
    actions:
    - persistEncryptedDraft
    - appendAudit
  - id: RPT-002
    from: CONSENTED
    event: QUEUE
    to: QUEUED
    guard: consentStillValid && withinTtl
    actions:
    - enqueueReport
  - id: RPT-003
    from: QUEUED
    event: SUBMIT
    to: SUBMITTING
    guard: networkAndEndpointAvailable && withinTtl
    actions:
    - submitReport
  - id: RPT-004
    from: SUBMITTING
    event: ACCEPTED
    to: SUBMITTED
    guard: 'true'
    actions:
    - recordReceipt
    - deleteSensitivePayload
    - appendAudit
  - id: RPT-005
    from: SUBMITTING
    event: RETRYABLE_FAILURE
    to: FAILED_RETRYABLE
    guard: withinTtl
    actions:
    - recordFailure
  - id: RPT-006
    from: FAILED_RETRYABLE
    event: RETRY
    to: QUEUED
    guard: retryAllowed && consentStillValid && withinTtl
    actions:
    - enqueueReport
  - id: RPT-007
    from:
    - DRAFT
    - CONSENTED
    - QUEUED
    - FAILED_RETRYABLE
    event: CANCEL
    to: CANCELLED
    guard: 'true'
    actions:
    - deleteSensitivePayload
    - appendAudit
  - id: RPT-008
    from:
    - DRAFT
    - CONSENTED
    - QUEUED
    - FAILED_RETRYABLE
    event: TTL_EXPIRED
    to: EXPIRED
    guard: 'true'
    actions:
    - deleteSensitivePayload
    - appendAudit
- id: TOKEN
  initial: ISSUING
  terminal:
  - REVOKED
  - EXPIRED
  - FAILED
  states:
  - ISSUING
  - ACTIVE
  - REVOCATION_REQUESTED
  - DRAINING
  - REVOKED
  - EXPIRED
  - FAILED
  guards:
    issuanceValid: registration ACTIVE, requested scopes allowed, transport constraint valid and verifier persisted atomically
    epochCurrent: token revocation epoch equals durable token epoch
    noOldUse: no request, stream, queue or session remains usable under the old token epoch
    terminalTargetRevoked: drain cause is explicit revocation
    terminalTargetExpired: drain cause is expiry
  actions:
    persistToken: persist verifier, scopes, transport constraint, expiry, epoch and state
    bumpEpochAndReject: atomically bump token epoch and reject new authentication
    drainOwnedState: close streams, remove queue entries, cancel active operations and close token-owned sessions according
      to policy
    erasePlaintextReceipt: delete encrypted issuance receipt at acknowledgement or receipt expiry
    appendAudit: append actor, cause, scope, epoch and completion evidence
  invariants:
  - token plaintext is available only in the bounded issuance receipt window
  - loopback-only tokens are never accepted by the LAN listener
  - revocation or expiry is not reported complete until old-epoch capability use is fenced
  - the database stores an HMAC verifier, never bearer plaintext
  transitions:
  - id: TOKEN-001
    from: ISSUING
    event: ISSUE_COMMITTED
    to: ACTIVE
    guard: issuanceValid
    actions:
    - persistToken
    - appendAudit
  - id: TOKEN-002
    from: ISSUING
    event: ISSUE_FAILED
    to: FAILED
    guard: 'true'
    actions:
    - erasePlaintextReceipt
    - appendAudit
  - id: TOKEN-003
    from: ACTIVE
    event: REVOKE
    to: REVOCATION_REQUESTED
    guard: epochCurrent
    actions:
    - bumpEpochAndReject
    - persistToken
    - appendAudit
  - id: TOKEN-004
    from: ACTIVE
    event: EXPIRE
    to: REVOCATION_REQUESTED
    guard: epochCurrent
    actions:
    - bumpEpochAndReject
    - persistToken
    - appendAudit
  - id: TOKEN-005
    from: REVOCATION_REQUESTED
    event: BEGIN_DRAIN
    to: DRAINING
    guard: 'true'
    actions:
    - drainOwnedState
  - id: TOKEN-006
    from: DRAINING
    event: DRAIN_COMPLETE
    to: REVOKED
    guard: noOldUse && terminalTargetRevoked
    actions:
    - erasePlaintextReceipt
    - persistToken
    - appendAudit
  - id: TOKEN-007
    from: DRAINING
    event: DRAIN_COMPLETE
    to: EXPIRED
    guard: noOldUse && terminalTargetExpired
    actions:
    - erasePlaintextReceipt
    - persistToken
    - appendAudit
