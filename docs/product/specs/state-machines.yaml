    - publishTerminal
  - id: OPR-006
    from: STARTING
    event: CANCEL
    to: CANCELLING
    guard: 'true'
    actions:
    - recordCancel
  - id: OPR-007
    from: STARTING
    event: REPLY_OR_WORKER_LOST
    to: RECONCILING
    guard: 'true'
    actions:
    - queryOutcome
  - id: OPR-008
    from: RUNNING
    event: SUCCESS
    to: COMPLETED
    guard: 'true'
    actions:
    - publishTerminal
  - id: OPR-009
    from: RUNNING
    event: FAILURE
    to: FAILED
    guard: 'true'
    actions:
    - publishTerminal
  - id: OPR-010
    from: RUNNING
    event: CANCEL
    to: CANCELLING
    guard: 'true'
    actions:
    - recordCancel
  - id: OPR-011
    from: RUNNING
    event: REPLY_OR_WORKER_LOST
    to: RECONCILING
    guard: 'true'
    actions:
    - queryOutcome
  - id: OPR-012
