# Project-wide Gradle settings for OmniLLM Android monorepo.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX / R8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
# Prefer in-process Kotlin compiler on Windows hosts that thrash the Kotlin daemon caches.
kotlin.compiler.execution.strategy=in-process

# ---------------------------------------------------------------------------
# Toolchain lock (also mirrored in gradle/libs.versions.toml)
# JDK 17+ required by AGP 9.x. compileSdk/targetSdk = 36 (Play API 36 baseline).
# minSdk = 28 (product decision — see README.md).
# NDK r28+ for default 16 KB page-size alignment (ANDROID-NATIVE).
# Play manual gates: gradle/RELEASE_CHECKLIST.md
# Do not lower compileSdk/targetSdk for Play AAB without policy recheck.
# ---------------------------------------------------------------------------
omnillm.minSdk=28
omnillm.compileSdk=36
omnillm.targetSdk=36

