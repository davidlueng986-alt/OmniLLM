schemaVersion: 2
authority: specs/database/omnillm-schema.sql
compatibility:
  currentVersion: 2
  minReadableVersion: 2
  minWritableVersion: 2
  metadataTable: schema_metadata
rules:
- PRAGMA foreign_keys=ON is mandatory for every connection and migration test
- schemaVersion is monotonically increasing; migrations are forward-only unless a tested downgrade path exists
- each migration declares minimum readable and writable versions
- identity, trust, request/commit, reservation/allocation, license and content-report data use shadow-copy verification before
  destructive change
- the Runtime control plane is the only writer
- kill-at-every-step must leave either the old valid schema or the new valid schema
- schema SQL, indexes, triggers and migration fixtures are diffed by repository validation
- unknown security-critical state or enum values fail closed
journal:
  table: schema_migration_attempts
  requiredFields:
  - migrationId
  - fromVersion
  - toVersion
  - state
  - startedAt
  - updatedAt
  - errorCode
  states:
  - STARTED
  - COMMITTED
  - ROLLED_BACK
  - FAILED
  - QUARANTINED
  terminalStates:
  - COMMITTED
  - ROLLED_BACK
  - FAILED
  - QUARANTINED
  transitions:
  - STARTED -> COMMITTED
  - STARTED -> ROLLED_BACK
  - STARTED -> FAILED
  - STARTED -> QUARANTINED
history:
  table: schema_migration_history
  semantics: append exactly once in the same transaction that advances schema_metadata and marks the matching attempt COMMITTED
recovery:
  STARTED: verify plan digest and schema fingerprint; resume an idempotent step, roll back to the old fingerprint, or quarantine
  ROLLED_BACK: old schema remains readable and writable at its declared compatibility versions
  FAILED: old schema remains authoritative; automatic retry requires the same plan digest
  QUARANTINED: open read-only for bounded export/diagnostics; no domain writer starts
fixtures:
  catalog: specs/database/migration-fixtures.yaml
  executableForwardMigration: specs/database/migrations/0001_to_0002.sql
